<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mapa Tienda</title>
<link rel="icon" href="icon.png">
<style>
  :root { --primary:#111111; --accent:#2563eb; --bg:#fafafa; --panel:#fff; --border:#e5e7eb; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; }
  body { margin:0; font-family:-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); display:flex; flex-direction:column; }
  header { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:8px; padding:0 14px 0 0; background:#111; position:sticky; top:0; z-index:5; }
  .titleWrap { display:flex; align-items:center; gap:0; flex-wrap:wrap; }
  .headerLogo { height:52px; width:52px; object-fit:contain; flex-shrink:0; padding:8px; box-sizing:border-box; filter:invert(1); }
  header h1 { font-size:14px; margin:0; text-transform:uppercase; letter-spacing:0.08em; font-weight:800; color:#fff; padding:8px 4px; }
  .storeBadge { font-size:11px; font-weight:800; color:#fff; background:var(--accent); border-radius:4px; padding:2px 7px; letter-spacing:0.02em; white-space:nowrap; }
  .storeSelectWrap { display:flex; align-items:center; padding:10px 0 10px 10px; }
  #storeSelect { border:1px solid #111; border-radius:6px; padding:5px 8px; font-size:12px; font-weight:700; background:#fff; color:#111; }
  header .actions { display:flex; gap:8px; align-items:center; padding:10px 0; }
  .priceAlertBtn { background:#dc2626; color:#fff; border-radius:8px; padding:8px 12px; font-size:12px; font-weight:700; display:none; align-items:center; gap:6px; animation: priceGlow 1.6s ease-in-out infinite; }
  @keyframes priceGlow {
    0%, 100% { box-shadow:0 0 0 0 rgba(220,38,38,0.55); }
    50% { box-shadow:0 0 0 9px rgba(220,38,38,0); }
  }
  .priceOld { text-decoration:line-through; color:#dc2626; }
  .priceNew { color:#2563eb; font-weight:700; }
  .priceChangeDate { display:block; font-size:11px; color:#9ca3af; margin-top:2px; }
  .priceChangeActions { display:flex; flex-direction:column; gap:4px; flex-shrink:0; }
  .priceChangeActions button { font-size:11px; padding:6px 10px; }
  .globalSearchWrap { position:relative; }
  .globalSearchWrap input { padding:8px 10px; border:1px solid var(--border); border-radius:8px; font-size:13px; width:150px; }
  .globalSearchResults:empty { display:none; }
  .globalSearchResults { position:absolute; top:110%; left:0; width:260px; max-height:300px; overflow-y:auto; background:#fff; border:1px solid var(--border); border-radius:8px; box-shadow:0 4px 12px rgba(0,0,0,.2); z-index:20; }
  .globalSearchResults .gsItem { display:flex; align-items:center; gap:8px; padding:8px; border-bottom:1px solid #eee; }
  .globalSearchResults .gsItem:last-child { border-bottom:none; }
  .globalSearchResults .gsItem img { width:30px; height:30px; object-fit:cover; border-radius:4px; background:#f0f0f0; flex-shrink:0; }
  .globalSearchResults .gsInfo { flex:1; font-size:12px; }
  .globalSearchResults .gsLoc { color:#2563eb; font-weight:600; }
  .globalSearchResults .gsUnplaced { color:#b91c1c; }
  .globalSearchResults .gsAssignBtn { background:#111; color:#fff; font-size:11px; padding:5px 8px; border-radius:6px; flex-shrink:0; }
  .lightboxOverlay { position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:50; display:flex; align-items:center; justify-content:center; padding:20px; }
  .lightboxOverlay img { max-width:100%; max-height:100%; border-radius:6px; }
  .lightboxable { cursor:zoom-in; }
  #welcomeOverlay { position:fixed; inset:0; background:#0a0a0a; z-index:100; display:flex; align-items:center; justify-content:center; padding:20px; }
  .welcomeBox { max-width:360px; width:100%; text-align:center; }
  .welcomeBox img { height:64px; width:64px; object-fit:contain; margin-bottom:18px; filter:invert(1); }
  .welcomeBox h2 { font-size:20px; text-transform:uppercase; letter-spacing:0.12em; margin:0 0 6px; color:#fff; font-weight:800; }
  .welcomeBox p { font-size:12px; color:#9ca3af; margin:0 0 28px; text-transform:uppercase; letter-spacing:0.06em; }
  .welcomeBox label { display:block; font-size:10px; color:#9ca3af; text-transform:uppercase; letter-spacing:0.08em; text-align:left; margin-bottom:6px; }
  .welcomeBox select { margin-top:6px; }
  .welcomeBox select, .welcomeBox input[type=password] { background:#1a1a1a; border:1px solid #333; color:#fff; margin-bottom:16px; }
  .welcomeBox select:focus, .welcomeBox input[type=password]:focus { outline:none; border-color:#fff; }
  .welcomeBox button { width:100%; padding:13px; font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:0.08em; background:#fff; color:#111; }
  .welcomeBox button:active { background:#e5e5e5; }
  .welcomeError { color:#f87171; font-size:12px; margin:-8px 0 16px; min-height:16px; }
  #pwModalOverlay { position:fixed; inset:0; background:rgba(10,10,10,0.9); z-index:110; display:none; align-items:center; justify-content:center; padding:20px; }
  #pwModalOverlay.open { display:flex; }
  .pwModalBox { background:#0a0a0a; border:1px solid #333; border-radius:14px; padding:28px 24px; max-width:320px; width:100%; text-align:center; }
  .pwModalBox h2 { font-size:15px; text-transform:uppercase; letter-spacing:0.1em; margin:0 0 20px; color:#fff; font-weight:800; }
  .pwModalBox input[type=password] { background:#1a1a1a; border:1px solid #333; color:#fff; margin-bottom:14px; }
  .pwModalBox input[type=password]:focus { outline:none; border-color:#fff; }
  .pwModalBox label { display:flex; align-items:center; gap:8px; font-size:12px; color:#9ca3af; margin-bottom:16px; cursor:pointer; }
  .pwModalBox label input { width:auto; margin:0; }
  .pwModalBox .pwModalError { color:#f87171; font-size:12px; margin:-6px 0 14px; min-height:16px; }
  .pwModalBox .pwModalRow { display:flex; gap:8px; }
  .pwModalBox button { flex:1; padding:11px; font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:0.06em; }
  .pwModalBox .pwModalOk { background:#fff; color:#111; }
  .pwModalBox .pwModalCancel { background:#1a1a1a; color:#fff; border:1px solid #333; }
  #appModalOverlay { position:fixed; inset:0; background:rgba(10,10,10,0.9); z-index:120; display:none; align-items:center; justify-content:center; padding:20px; }
  #appModalOverlay.open { display:flex; }
  .appModalBox { background:#0a0a0a; border:1px solid #333; border-radius:14px; padding:26px 22px; max-width:340px; width:100%; text-align:center; }
  .appModalBox p { font-size:14px; color:#fff; margin:0 0 20px; line-height:1.5; white-space:pre-line; }
  .appModalBox .appModalRow { display:flex; gap:8px; }
  .appModalBox button { flex:1; padding:11px; font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:0.06em; }
  .appModalBox .appModalOk { background:#fff; color:#111; }
  .appModalBox .appModalCancel { background:#1a1a1a; color:#fff; border:1px solid #333; }
  button { border:none; border-radius:8px; padding:8px 12px; font-size:14px; cursor:pointer; }
  .btn-primary { background:var(--primary); color:#fff; }
  .btn-ghost { background:#e5e7eb; color:#111; }
  #mapWrap { padding:10px; flex:1; min-height:0; overflow:hidden; box-sizing:border-box; }
  #mapViewport { width:100%; overflow:hidden; }
  #map {
    position:relative; width:100%; aspect-ratio:16/10;
    background-color:#f5f5f6;
    background-image:
      linear-gradient(to right, rgba(37,99,235,0.15) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(37,99,235,0.15) 1px, transparent 1px),
      linear-gradient(to right, rgba(0,0,0,0.05) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(0,0,0,0.05) 1px, transparent 1px);
    background-size: 8% 12.8%, 8% 12.8%, 2% 3.2%, 2% 3.2%;
    border:1px solid var(--border); border-radius:10px; touch-action:none; user-select:none; -webkit-user-select:none;
  }

  .furniture { position:absolute; user-select:none; transform-origin:center center; }
  .furniture.selected { outline:2px dashed #f59e0b; outline-offset:2px; }
  .furniture.pinged { animation: pingPulse 1.4s ease-in-out 2; }
  @keyframes pingPulse {
    0%, 100% { outline: 3px solid transparent; }
    50% { outline: 3px solid #2563eb; outline-offset:3px; }
  }
  .selectionBox { position:absolute; border:1.5px dashed #2563eb; background:rgba(37,99,235,0.08); z-index:8; pointer-events:none; }
  .groupToolbar { position:absolute; top:8px; left:50%; transform:translateX(-50%); display:flex; gap:6px; background:#111; border-radius:8px; padding:6px; box-shadow:0 4px 12px rgba(0,0,0,.3); z-index:9; }
  .groupToolbar button { background:#fff; color:#111; font-size:12px; padding:6px 10px; }
  .groupToolbar button.danger { background:#fee2e2; color:#b91c1c; }

  .move-handle { position:absolute; left:50%; top:50%; width:26px; height:26px; margin-left:-13px; margin-top:-13px; border-radius:50%; background:rgba(0,0,0,0.35); display:flex; align-items:center; justify-content:center; cursor:move; z-index:4; touch-action:none; }
  .move-handle svg { width:16px; height:16px; }

  .resize-right { position:absolute; right:-8px; top:50%; margin-top:-8px; width:16px; height:16px; background:#111; opacity:.7; border-radius:50%; touch-action:none; z-index:5; cursor:ew-resize; }
  .resize-left { position:absolute; left:-8px; top:50%; margin-top:-8px; width:16px; height:16px; background:#111; opacity:.7; border-radius:50%; touch-action:none; z-index:5; cursor:ew-resize; }
  .resize-top { position:absolute; top:-8px; left:50%; margin-left:-8px; width:16px; height:16px; background:#111; opacity:.7; border-radius:50%; touch-action:none; z-index:5; cursor:ns-resize; }
  .resize-bottom { position:absolute; bottom:-8px; left:50%; margin-left:-8px; width:16px; height:16px; background:#111; opacity:.7; border-radius:50%; touch-action:none; z-index:5; cursor:ns-resize; }

  .rotate-handle { position:absolute; right:-22px; bottom:-22px; width:16px; height:16px; background:#f59e0b; border-radius:50%; touch-action:none; z-index:5; box-shadow:0 0 0 2px #fff; cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20"><path d="M10 3a7 7 0 1 1-6.32 4" fill="none" stroke="black" stroke-width="1.5"/><path d="M2 3v4h4" fill="none" stroke="black" stroke-width="1.5"/></svg>') 10 10, alias; }

  .quickBubble { position:absolute; top:0; left:100%; margin-left:8px; width:28px; height:28px; border-radius:50%; background:#111; color:#fff; display:flex; align-items:center; justify-content:center; font-size:16px; z-index:6; box-shadow:0 1px 4px rgba(0,0,0,.3); cursor:pointer; }
  .quickMenu { position:absolute; top:0; left:100%; margin-left:40px; background:#fff; border:1px solid var(--border); border-radius:8px; box-shadow:0 4px 12px rgba(0,0,0,.2); z-index:6; overflow:hidden; min-width:130px; }
  .quickMenu button { display:block; width:100%; text-align:left; padding:9px 12px; background:#fff; border:none; font-size:13px; border-bottom:1px solid #f0f0f0; }
  .quickMenu button:last-child { border-bottom:none; }
  .quickMenu button:active { background:#f3f4f6; }
  .quickMenu button.danger { color:#b91c1c; font-weight:600; }
  .mapContextMenu { position:absolute; background:#fff; border:1px solid var(--border); border-radius:8px; box-shadow:0 4px 12px rgba(0,0,0,.2); z-index:7; overflow:hidden; min-width:140px; }
  .mapContextMenu button { display:block; width:100%; text-align:left; padding:9px 12px; background:#fff; border:none; font-size:13px; border-bottom:1px solid #f0f0f0; }
  .mapContextMenu button:last-child { border-bottom:none; }
  .mapContextMenu button:active { background:#f3f4f6; }
  .mapContextMenu button:disabled { color:#9ca3af; cursor:default; }

  /* TABLE: fixed-size block + one strip of drawer tabs on a chosen edge */
  .furniture.table { background:#fff; border:2px solid #1e3a8a; border-radius:3px; }
  .furniture.counter { background:#f3f4f6; border:2px solid #9ca3af; border-radius:3px; display:flex; align-items:center; justify-content:center; }
  .furniture.counter.filled { background:#fff7ed; border-color:#c2410c; }
  .furniture.counter span { font-size:11px; color:#6b7280; text-align:center; padding:2px; }
  .furniture.counter.filled span { color:#c2410c; }
  .drawerStrip { position:absolute; display:flex; gap:2px; }
  .drawerStrip.edge-right, .drawerStrip.edge-left { flex-direction:column; top:6%; bottom:6%; width:22%; }
  .drawerStrip.edge-right { right:-3%; }
  .drawerStrip.edge-left { left:-3%; }
  .drawerStrip.edge-top, .drawerStrip.edge-bottom { flex-direction:row; left:6%; right:6%; height:26%; }
  .drawerStrip.edge-top { top:-4%; }
  .drawerStrip.edge-bottom { bottom:-4%; }
  .drawerTick { flex:1; background:#e5e7eb; border:1px solid #6b7280; border-radius:2px; display:flex; align-items:center; justify-content:center; font-size:8px; color:#4b5563; overflow:hidden; text-align:center; line-height:1; padding:1px; }
  .drawerTick.filled { background:#93c5fd; border-color:#1e3a8a; color:#1e3a8a; }
  .drawerTick:active { background:#3b82f6; }
  .furniture.table.editing .drawerTick { pointer-events:none; opacity:.5; }

  /* HANGER T: thin rectangle */
  .furniture.hanger-t { background:#fff; border:2px solid #7c3aed; border-radius:2px; display:flex; align-items:center; justify-content:center; }
  .furniture.hanger-t span { writing-mode:vertical-rl; font-size:10px; color:#7c3aed; }
  .furniture.hanger-t.filled { background:#7c3aed; }
  .furniture.hanger-t.filled span { color:#fff; }

  /* HANGER ROUND: circle */
  .furniture.hanger-round { background:#fff; border:2px solid #059669; border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .furniture.hanger-round span { font-size:10px; color:#059669; text-align:center; padding:2px; }
  .furniture.hanger-round.filled { background:#059669; }
  .furniture.hanger-round.filled span { color:#fff; }

  #sheetOverlay { position:fixed; inset:0; background:rgba(0,0,0,0.35); display:none; z-index:10; }
  #sheet { position:fixed; top:0; right:0; bottom:0; width:380px; max-width:90vw; background:var(--panel); border-radius:14px 0 0 14px; overflow-y:auto; padding:14px; transform:translateX(100%); transition:transform .2s ease; z-index:11; box-shadow:-4px 0 16px rgba(0,0,0,.15); }
  #sheet.open { transform:translateX(0); }
  #sheetOverlay.open { display:block; }
  .sheetHeader { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:8px; }
  .sheetHeader h2 { font-size:16px; margin:0; }
  .rowItem { display:flex; align-items:center; justify-content:space-between; padding:8px; border-bottom:1px solid #eee; gap:8px; }
  .rowItem:last-child { border-bottom:none; }
  .small { font-size:12px; color:#666; }
  .del { background:#fee2e2; color:#b91c1c; padding:6px 10px; font-size:12px; flex-shrink:0; }
  input[type=text], input[type=password], select { width:100%; padding:9px; border:1px solid var(--border); border-radius:8px; font-size:14px; }
  .crateNameInput { flex:1; border:1px solid var(--border); border-radius:6px; padding:6px; font-size:14px; }
  .addRow { display:flex; gap:6px; margin-top:10px; }
  .addRow input { flex:1; }
  .prodThumb { width:34px; height:34px; object-fit:cover; border-radius:4px; flex-shrink:0; background:#f0f0f0; }
  .searchWrap { margin-top:12px; }
  .searchResults { max-height:220px; overflow-y:auto; border:1px solid var(--border); border-radius:8px; margin-top:6px; }
  .searchResultItem { display:flex; align-items:center; gap:8px; padding:8px; border-bottom:1px solid #eee; cursor:pointer; }
  .searchResultItem:last-child { border-bottom:none; }
  .searchResultItem:active { background:#f3f4f6; }
  .searchResultItem.disabled { opacity:.5; cursor:default; }
  .searchResultItem .dupNote { display:block; font-size:10px; color:#b91c1c; }
  .searchResultItem img { width:34px; height:34px; object-fit:cover; border-radius:4px; flex-shrink:0; background:#f0f0f0; }
  .field { margin-top:10px; }
  .edgeSelectSmall { width:auto !important; flex-shrink:0; padding:6px; font-size:12px; }
  .field label { font-size:12px; color:#666; display:block; margin-bottom:4px; }
  .typeChoice { display:flex; flex-direction:column; gap:10px; }
  .typeChoice button { padding:14px; font-size:15px; text-align:left; }
</style>
</head>
<body>

<div id="welcomeOverlay">
  <div class="welcomeBox">
    <img src="icon.png" alt="">
    <h2>Mapa de tienda</h2>
    <p>Selecciona tu tienda para continuar</p>
    <select id="welcomeStoreSelect"></select>
    <label for="welcomePasswordInput">Contraseña</label>
    <input type="password" id="welcomePasswordInput" autocomplete="off">
    <label style="display:flex; align-items:center; gap:8px; text-transform:none; letter-spacing:normal; font-size:12px; margin:-6px 0 16px; cursor:pointer;">
      <input type="checkbox" id="welcomeRememberCheck" style="width:auto; margin:0;"> Recordar contraseña en este dispositivo
    </label>
    <div class="welcomeError" id="welcomeError"></div>
    <button id="welcomeEnterBtn">Entrar</button>
  </div>
</div>

<div id="pwModalOverlay">
  <div class="pwModalBox">
    <h2 id="pwModalTitle">Contraseña</h2>
    <input type="password" id="pwModalInput" autocomplete="off">
    <label>
      <input type="checkbox" id="pwModalRememberCheck"> Recordar contraseña en este dispositivo
    </label>
    <div class="pwModalError" id="pwModalError"></div>
    <div class="pwModalRow">
      <button class="pwModalCancel" id="pwModalCancelBtn">Cancelar</button>
      <button class="pwModalOk" id="pwModalOkBtn">Continuar</button>
    </div>
  </div>
</div>

<div id="appModalOverlay">
  <div class="appModalBox">
    <p id="appModalMessage"></p>
    <div class="appModalRow" id="appModalRow"></div>
  </div>
</div>

<header style="display:none;" id="appHeader">
  <div class="titleWrap">
    <img src="icon.png" alt="" class="headerLogo">
    <h1>Mapa de tienda</h1>
    <span id="storeBadge" class="storeBadge"></span>
    <div class="storeSelectWrap">
      <select id="storeSelect"></select>
    </div>
  </div>
  <div class="actions">
    <button id="priceAlertBtn" class="priceAlertBtn">⚠️ ¡Cambios de precio!</button>
    <button id="undoBtn" class="btn-ghost" style="display:flex; align-items:center; gap:6px;">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><polyline points="3 3 3 8 8 8"/></svg>
    </button>
    <div class="globalSearchWrap">
      <input type="text" id="globalSearchInput" placeholder="Buscar prenda..." autocomplete="off">
      <div id="globalSearchResults" class="globalSearchResults"></div>
    </div>
    <button id="addFurnitureBtn" class="btn-ghost">+ Mueble</button>
    <button id="listAllBtn" class="btn-ghost">Ver todos</button>
    <button id="saveCloudBtn" class="btn-primary" style="display:flex; align-items:center; gap:6px;">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Guardar
    </button>
  </div>
</header>

<div id="mapWrap" style="display:none;"><div id="mapViewport"><div id="map"></div></div></div>

<div id="sheetOverlay"></div>
<div id="sheet"></div>

<script>
const STORAGE_PREFIX = 'storeMapState_v3_';
const CURRENT_STORE_KEY = 'storeMapState_currentStore';

const STORE_LOCATIONS = {
  'K01': 'La Maquinista, Barcelona',
  'K26': 'Magic, Badalona',
  'K34': 'Gran Via 2, Barcelona',
  'K44': 'Girona',
  'K65': 'Baricentro, Barberà del Vallès',
  'K69': 'Parc Central, Tarragona',
  'K70': 'La Fira, Reus',
  'K72': 'Diagonal Mar, Barcelona',
  'K73': 'Lleida',
  'K75': 'Carrer Pelayo, Barcelona',
  'K77': 'Sant Cugat del Vallès',
  'K85': 'Platja d´Aro, Barcelona',
};

const LEGACY_STORAGE_KEY = 'storeMapState_v3'; // pre-multi-store save, migrated into K01
const STORE_CODES = ['K01','K26','K34','K42','K44','K65','K69','K70','K72','K73','K75','K77','K80','K85'];
const TABLE_W = 22, TABLE_H = 14; // fixed table size, % of map (grid-aligned)
const MAP_ASPECT = 16/10; // #map's aspect-ratio; h% = w% * MAP_ASPECT keeps a shape visually square/circular
const GRID = 2; // snap step, % of map
function snap(v){ return Math.round(v / GRID) * GRID; }

// Rotation is always a multiple of 45° in this app. Math.cos/sin return tiny
// non-zero noise at 90/180/270 (e.g. cos(90°) = 6.123e-17, not exactly 0),
// which snap() then rounds inconsistently frame-to-frame — this table removes
// that noise at the source instead of letting it propagate into the geometry.
const EXACT_TRIG = {
  0: {cos:1, sin:0},
  45: {cos:Math.SQRT1_2, sin:Math.SQRT1_2},
  90: {cos:0, sin:1},
  135: {cos:-Math.SQRT1_2, sin:Math.SQRT1_2},
  180: {cos:-1, sin:0},
  225: {cos:-Math.SQRT1_2, sin:-Math.SQRT1_2},
  270: {cos:0, sin:-1},
  315: {cos:Math.SQRT1_2, sin:-Math.SQRT1_2}
};
function trigFor(rot){
  const r = ((rot || 0) % 360 + 360) % 360;
  return EXACT_TRIG[r] || { cos: Math.cos(r*Math.PI/180), sin: Math.sin(r*Math.PI/180) };
}

function seedState(){ return { furniture: [] }; }
function storageKeyFor(code){ return STORAGE_PREFIX + code; }

let currentStore = localStorage.getItem(CURRENT_STORE_KEY) || 'K01';
if (!STORE_CODES.includes(currentStore)) currentStore = 'K01';

// one-time migration: old single-store save moves into K01 if K01 has nothing yet
(function migrateLegacy(){
  const legacy = localStorage.getItem(LEGACY_STORAGE_KEY);
  if (legacy && !localStorage.getItem(storageKeyFor('K01'))) {
    localStorage.setItem(storageKeyFor('K01'), legacy);
  }
})();

let state = JSON.parse(localStorage.getItem(storageKeyFor(currentStore)) || 'null') || seedState();
// one-time migration: snap previously-saved fixtures onto the current grid
state.furniture.forEach(f => {
  f.x = snap(f.x); f.y = snap(f.y);
  f.w = snap(f.w); f.h = snap(f.h);
  if (f.type === 'hanger-round') f.h = f.w * MAP_ASPECT;
  if (f.type === 'table' && f.drawers) {
    const legacyEdge = f.edge || 'right';
    f.drawers.forEach(d => { if (!d.edge) d.edge = legacyEdge; });
  }
});
localStorage.setItem(storageKeyFor(currentStore), JSON.stringify(state));

async function verifyPasswordDirect(code, password){
  const res = await fetchWithTimeout(`${CLOUD_API_URL}/store/${code}/verify`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password })
  });
  return res.ok;
}

async function attemptEnter(){
  const code = welcomeStoreSelect.value;
  const password = welcomePasswordInput.value;
  welcomeError.textContent = '';
  if (!password) { welcomeError.textContent = 'Introduce la contraseña.'; return; }
  welcomeEnterBtn.disabled = true;
  welcomeEnterBtn.textContent = 'Verificando...';
  try {
    const ok = await verifyPasswordDirect(code, password);
    if (!ok) {
      welcomeError.textContent = 'Contraseña incorrecta.';
      welcomeEnterBtn.disabled = false;
      welcomeEnterBtn.textContent = 'Entrar';
      return;
    }
    sessionPasswords[code] = password;
    if (welcomeRememberCheck.checked) setRememberedPassword(code, password);
    else clearRememberedPassword(code);
    currentStore = code;
    localStorage.setItem(CURRENT_STORE_KEY, currentStore);
    state = JSON.parse(localStorage.getItem(storageKeyFor(currentStore)) || 'null') || seedState();
    storeSelect.value = currentStore;
    updateBadge();
    welcomeOverlay.style.display = 'none';
    appHeader.style.display = '';
    document.getElementById('mapWrap').style.display = '';
    render();
    updateMapHeight();
    updatePriceAlertButton();
    loadFromCloud(currentStore).then(() => {
      if (shouldAutoRefresh(code)) {
        markAutoRefreshed(code);
        autoRefreshPricesAndImages(code);
      }
    });
  } catch (err) {
    welcomeError.textContent = 'No se pudo conectar con el servidor.';
    welcomeEnterBtn.disabled = false;
    welcomeEnterBtn.textContent = 'Entrar';
  }
}

function persist(){ localStorage.setItem(storageKeyFor(currentStore), JSON.stringify(state)); }
function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }

let undoStack = [];
function pushUndo(){
  undoStack.push(JSON.stringify(state.furniture));
  if (undoStack.length > 50) undoStack.shift();
  localDirtySinceLoad = true;
}
function undo(){
  if (!undoStack.length) return;
  state.furniture = JSON.parse(undoStack.pop());
  clearSelection();
  quickMenuOpenFor = null;
  persist();
  sheet.classList.remove('open');
  sheetOverlay.classList.remove('open');
  render();
}
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
    e.preventDefault();
    undo();
  }
});

const KOROSHI_PROXY_URL = 'https://koroshishop.linkgarcia93.workers.dev';
const CLOUD_API_URL = KOROSHI_PROXY_URL; // same Worker also serves /store/<code>

async function fetchWithTimeout(url, options, timeoutMs){
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs || 10000);
  try {
    return await fetch(url, { ...options, signal: controller.signal });
  } catch (err) {
    if (err.name === 'AbortError') throw new Error('Tiempo de espera agotado');
    throw err;
  } finally {
    clearTimeout(timer);
  }
}

function appAlert(message){
  return new Promise((resolve) => {
    const overlay = document.getElementById('appModalOverlay');
    const msgEl = document.getElementById('appModalMessage');
    const rowEl = document.getElementById('appModalRow');
    msgEl.textContent = message;
    rowEl.innerHTML = '<button class="appModalOk" id="appModalOkOnly">Aceptar</button>';
    overlay.classList.add('open');
    document.getElementById('appModalOkOnly').addEventListener('click', () => {
      overlay.classList.remove('open');
      resolve();
    });
  });
}

function appConfirm(message, okLabel, cancelLabel){
  return new Promise((resolve) => {
    const overlay = document.getElementById('appModalOverlay');
    const msgEl = document.getElementById('appModalMessage');
    const rowEl = document.getElementById('appModalRow');
    msgEl.textContent = message;
    rowEl.innerHTML =
      '<button class="appModalCancel" id="appModalCancelBtn2">' + (cancelLabel || 'Cancelar') + '</button>' +
      '<button class="appModalOk" id="appModalOkBtn2">' + (okLabel || 'Aceptar') + '</button>';
    overlay.classList.add('open');
    function cleanup(result){
      overlay.classList.remove('open');
      resolve(result);
    }
    document.getElementById('appModalOkBtn2').addEventListener('click', () => cleanup(true));
    document.getElementById('appModalCancelBtn2').addEventListener('click', () => cleanup(false));
  });
}

function cleanKoroshiTitle(title){
  let t = title;
  // Koroshi shows up in different shapes: "... | Koroshi", "... – Koroshi Granate",
  // "... – Koroshi Gris" (brand embedded mid-string, followed by a color) — strip the
  // brand together with whatever separator precedes it, wherever it sits.
  t = t.replace(/\s*[-–—|]\s*koroshi\b\s*/gi, ' ');
  t = t.replace(/\bkoroshi\b\s*/gi, ' ');
  t = t.replace(/\s{2,}/g, ' ').trim();
  t = t.replace(/^[-–—|]\s*/, '').replace(/\s*[-–—|]\s*$/, '').trim();
  return t;
}

function productHasVariantSku(r, sku){
  return (r.variants || []).some(v => v.sku && trimSkuZeros(v.sku) === sku);
}
function getVariantBySku(r, sku){
  return (r.variants || []).find(v => v.sku && trimSkuZeros(v.sku) === sku);
}
function trimSkuZeros(sku){
  // Shopify SKU format here is BASE-NUMBER-SIZE (e.g. 2621PT87-000014-S) — drop the size, then strip leading zeros from the number
  const parts = sku.split('-');
  if (parts.length >= 3) parts.pop(); // drop trailing size code
  if (parts.length < 2) return sku;
  const numPart = parts.pop();
  const trimmedNum = numPart.replace(/^0+(?=\d)/, '');
  return parts.join('-') + '-' + trimmedNum;
}

async function loadFromCloud(code){
  try {
    const res = await fetch(`${CLOUD_API_URL}/store/${code}`);
    if (!res.ok) return;
    const data = await res.json();
    remoteVersion = data.version || 0; // always track the real server version, even mid-edit
    if (localDirtySinceLoad) return; // but don't overwrite furniture the user already started changing
    if (data.furniture) {
      state.furniture = data.furniture;
      persist();
      render();
    }
  } catch (err) {
    // offline or Worker unreachable — keep whatever's already loaded locally
  }
}

async function saveToCloud(code, forcing){
  const ok = await verifyPasswordFor(code);
  if (!ok) return;
  const password = sessionPasswords[code];
  const baseVersionSent = remoteVersion;
  try {
    const res = await fetchWithTimeout(`${CLOUD_API_URL}/store/${code}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password, baseVersion: baseVersionSent, furniture: state.furniture })
    });
    const data = await res.json();
    if (res.status === 401) {
      await appAlert('Contraseña incorrecta.');
      delete sessionPasswords[code];
      return;
    }
    if (res.status === 409) {
      const serverVersion = data.current ? data.current.version : '?';
      const wantForce = await appConfirm(
        'Alguien más guardó cambios en ' + code + ' (tu versión: ' + baseVersionSent + ', versión en el servidor: ' + serverVersion + ').\n\n' +
        'Aceptar = sobrescribir con tus cambios actuales de todas formas.\nCancelar = no guardar, recargar primero.',
        'Sobrescribir', 'Cancelar'
      );
      if (wantForce) {
        remoteVersion = data.current ? data.current.version : remoteVersion;
        return saveToCloud(code, true);
      }
      return;
    }
    if (!res.ok) {
      await appAlert('No se pudo guardar (' + (data.error || res.status) + ').');
      return;
    }
    sessionPasswords[code] = password;
    remoteVersion = data.version;
    localDirtySinceLoad = false;
    await appAlert('Guardado en la nube.');
  } catch (err) {
    await appAlert('No se pudo conectar con el servidor (' + err.message + ').');
  }
}

function verifyPasswordFor(code){
  if (sessionPasswords[code]) return Promise.resolve(true);

  const remembered = getRememberedPassword(code);
  if (remembered) {
    sessionPasswords[code] = remembered; // trust the local record; a real mismatch surfaces via the normal 401 flow elsewhere
    return Promise.resolve(true);
  }

  return new Promise((resolve) => {
    const overlay = document.getElementById('pwModalOverlay');
    const title = document.getElementById('pwModalTitle');
    const input = document.getElementById('pwModalInput');
    const rememberCheck = document.getElementById('pwModalRememberCheck');
    const errorEl = document.getElementById('pwModalError');
    const okBtn = document.getElementById('pwModalOkBtn');
    const cancelBtn = document.getElementById('pwModalCancelBtn');

    title.textContent = 'Contraseña para ' + code;
    input.value = '';
    rememberCheck.checked = false;
    errorEl.textContent = '';
    overlay.classList.add('open');
    setTimeout(() => input.focus(), 50);

    function cleanup(){
      overlay.classList.remove('open');
      okBtn.removeEventListener('click', onOk);
      cancelBtn.removeEventListener('click', onCancel);
      input.removeEventListener('keydown', onKeydown);
    }
    async function onOk(){
      const pw = input.value;
      if (!pw) { errorEl.textContent = 'Introduce la contraseña.'; return; }
      okBtn.disabled = true;
      okBtn.textContent = 'Verificando...';
      try {
        const res = await fetchWithTimeout(`${CLOUD_API_URL}/store/${code}/verify`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pw })
        });
        if (res.ok) {
          sessionPasswords[code] = pw;
          if (rememberCheck.checked) setRememberedPassword(code, pw);
          cleanup();
          resolve(true);
          return;
        }
        errorEl.textContent = 'Contraseña incorrecta.';
        okBtn.disabled = false;
        okBtn.textContent = 'Continuar';
      } catch (err) {
        errorEl.textContent = 'No se pudo conectar con el servidor.';
        okBtn.disabled = false;
        okBtn.textContent = 'Continuar';
      }
    }
    function onCancel(){
      cleanup();
      resolve(false);
    }
    function onKeydown(e){ if (e.key === 'Enter') onOk(); }

    okBtn.addEventListener('click', onOk);
    cancelBtn.addEventListener('click', onCancel);
    input.addEventListener('keydown', onKeydown);
  });
}

let koroshiSearchAbort = null;
async function searchKoroshi(query){
  if (koroshiSearchAbort) koroshiSearchAbort.abort();
  koroshiSearchAbort = new AbortController();
  const url = `${KOROSHI_PROXY_URL}?q=${encodeURIComponent(query)}`;
  const res = await fetch(url, { signal: koroshiSearchAbort.signal });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  return (data.resources && data.resources.results && data.resources.results.products) || [];
}

function newFixture(type){
  const base = { id: uid('f'), type, x:snap(35), y:snap(35) };
  if (type === 'table') {
    return { ...base, name:'Mesa', w:snap(TABLE_W), h:snap(TABLE_H), rot:0,
      drawers:[{id:uid('d'),name:'Cajón 1',edge:'right',products:[]},{id:uid('d'),name:'Cajón 2',edge:'right',products:[]}] };
  }
  if (type === 'counter') {
    return { ...base, name:'Mostrador', w:snap(26), h:snap(14), rot:0,
      drawers:[{id:uid('d'),name:'Mostrador',products:[]}] };
  }
  if (type === 'hanger-t') {
    return { ...base, name:'Percha', w:snap(2), h:TABLE_H, rot:0, drawers:[{id:uid('d'),name:'Percha',products:[]}] };
  }
  const rw = snap(8);
  return { ...base, name:'Percha redonda', w:rw, h:rw*MAP_ASPECT, rot:0, drawers:[{id:uid('d'),name:'Percha redonda',products:[]}] };
}

function render(){
  mapEl.innerHTML = '';
  updateMapHeight();
  state.furniture.forEach(f => {
    const el = document.createElement('div');
    const selHere = isSelected(f.id);
    const isFilled = (f.type === 'counter' || f.type === 'hanger-t' || f.type === 'hanger-round') && f.drawers[0] && f.drawers[0].products.length;
    el.className = 'furniture ' + f.type + (selHere ? ' selected' : '') + (isFilled ? ' filled' : '');
    el.style.left = f.x + '%';
    el.style.top = f.y + '%';
    el.style.width = f.w + '%';
    el.style.height = f.h + '%';
    el.style.transform = f.rot ? `rotate(${f.rot}deg)` : '';
    el.dataset.id = f.id;

    if (f.type === 'table') {
      ['right','left','top','bottom'].forEach(edge => {
        const drawersOnEdge = f.drawers.filter(d => (d.edge || 'right') === edge);
        if (!drawersOnEdge.length) return;
        const strip = document.createElement('div');
        strip.className = 'drawerStrip edge-' + edge;
        drawersOnEdge.forEach(d => {
          const tick = document.createElement('div');
          tick.className = 'drawerTick' + (d.products.length ? ' filled' : '');
          const label = document.createElement('span');
          label.textContent = d.name;
          label.style.display = 'inline-block';
          label.style.transform = f.rot ? `rotate(${-f.rot}deg)` : '';
          tick.appendChild(label);
          tick.addEventListener('click', (e) => { e.stopPropagation(); openViewSheet(f.id, d.id); });
          strip.appendChild(tick);
        });
        el.appendChild(strip);
      });
      el.addEventListener('click', (e) => {
        if (e.target.closest('.drawerTick, .move-handle, .resize-right, .resize-left, .resize-top, .resize-bottom, .rotate-handle, .quickBubble, .quickMenu')) return;
        if (e.ctrlKey || e.metaKey) { toggleSelect(f.id); }
        else { (selectedIds.has(f.id) && selectedIds.size === 1) ? clearSelection() : selectOnly(f.id); }
        quickMenuOpenFor = null;
        render();
      });
    } else if (f.type === 'counter') {
      const span = document.createElement('span');
      span.textContent = f.name;
      span.style.display = 'inline-block';
      span.style.transform = f.rot ? `rotate(${-f.rot}deg)` : '';
      el.appendChild(span);
      el.addEventListener('click', (e) => {
        if (e.target.closest('.move-handle, .resize-right, .resize-left, .resize-top, .resize-bottom, .rotate-handle, .quickBubble, .quickMenu')) return;
        if (e.ctrlKey || e.metaKey) { toggleSelect(f.id); }
        else { (selectedIds.has(f.id) && selectedIds.size === 1) ? clearSelection() : selectOnly(f.id); }
        quickMenuOpenFor = null;
        render();
      });
    } else {
      const span = document.createElement('span');
      span.textContent = f.name;
      span.style.display = 'inline-block';
      span.style.transform = f.rot ? `rotate(${-f.rot}deg)` : '';
      el.appendChild(span);
      el.addEventListener('click', (e) => {
        if (e.target.closest('.move-handle, .resize-right, .resize-left, .resize-top, .resize-bottom, .rotate-handle, .quickBubble, .quickMenu')) return;
        if (e.ctrlKey || e.metaKey) {
          if (pendingClickTimer) { clearTimeout(pendingClickTimer); pendingClickTimer = null; }
          toggleSelect(f.id);
          quickMenuOpenFor = null;
          render();
          return;
        }
        if (pendingClickTimer) { clearTimeout(pendingClickTimer); pendingClickTimer = null; return; }
        pendingClickTimer = setTimeout(() => {
          pendingClickTimer = null;
          openViewSheet(f.id, f.drawers[0].id);
        }, 260);
      });
    }

    const moveHandle = document.createElement('div');
    moveHandle.className = 'move-handle';
    moveHandle.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M12 2v20M2 12h20M12 2l-3 3M12 2l3 3M12 22l-3-3M12 22l3-3M2 12l3-3M2 12l3 3M22 12l-3-3M22 12l-3 3"/></svg>';
    el.appendChild(moveHandle);
    enableDrag(moveHandle, el, f);

    el.addEventListener('dblclick', (e) => { e.preventDefault(); e.stopPropagation(); if (pendingClickTimer) { clearTimeout(pendingClickTimer); pendingClickTimer = null; } selectOnly(f.id); quickMenuOpenFor = f.id; render(); });
    el.addEventListener('contextmenu', (e) => { e.preventDefault(); e.stopPropagation(); if (pendingClickTimer) { clearTimeout(pendingClickTimer); pendingClickTimer = null; } selectOnly(f.id); quickMenuOpenFor = f.id; render(); });

    if (selectedIds.size === 1 && selHere) {
      ['right','left','top','bottom'].forEach(edge => {
        const h = document.createElement('div');
        h.className = 'resize-' + edge;
        h.style.cursor = resizeCursorFor(edge, f.rot);
        el.appendChild(h);
        enableResizeEdge(h, el, f, edge);
      });

      const rotHandle = document.createElement('div');
      rotHandle.className = 'rotate-handle';
      el.appendChild(rotHandle);
      enableRotate(rotHandle, el, f);

      const bubble = document.createElement('div');
      bubble.className = 'quickBubble';
      bubble.textContent = '⋮';
      bubble.style.transform = f.rot ? `rotate(${-f.rot}deg)` : '';
      bubble.addEventListener('click', (e) => { e.stopPropagation(); toggleQuickMenu(f.id); });
      el.appendChild(bubble);

      if (quickMenuOpenFor === f.id) {
        const menu = document.createElement('div');
        menu.className = 'quickMenu';
        menu.style.transform = f.rot ? `rotate(${-f.rot}deg)` : '';
        const items = [];
        if (f.type === 'table' || f.type === 'counter') items.push(['Girar 45°', () => rotateFixture(f.id)]);
        if (f.type === 'counter') items.push(['Ver contenido', () => { closeQuickMenu(); openViewSheet(f.id, f.drawers[0].id); }]);
        items.push(['Editar', () => { closeQuickMenu(); openEditSheet(f.id); }]);
        if (f.type === 'table') items.push(['+ Cajón', () => addDrawerQuick(f.id)]);
        items.push(['Copiar', () => copyFixture(f.id)]);
        items.push(['Duplicar', () => duplicateFixture(f.id)]);
        items.push(['Eliminar', () => {
          pushUndo();
          state.furniture = state.furniture.filter(x => x.id !== f.id);
          clearSelection(); persist(); closeQuickMenu(); render();
        }]);
        items.forEach(([label, fn]) => {
          const b = document.createElement('button');
          if (label === 'Eliminar') b.className = 'danger';
          b.textContent = label;
          b.addEventListener('click', (e) => { e.stopPropagation(); fn(); });
          menu.appendChild(b);
        });
        el.appendChild(menu);
      }
    }

    mapEl.appendChild(el);
  });

  if (mapContextMenuAt) {
    const menu = document.createElement('div');
    menu.className = 'mapContextMenu';
    menu.style.left = mapContextMenuAt.x + '%';
    menu.style.top = mapContextMenuAt.y + '%';
    const items = [
      ['Nuevo mueble', () => { closeMapContextMenu(); addFurnitureBtn.click(); }],
      ['Pegar', (clipboardFixtures && clipboardFixtures.length) ? () => pasteFixturesAt(mapContextMenuAt.x, mapContextMenuAt.y) : null]

      else b.addEventListener('click', (e) => { e.stopPropagation(); fn(); });
      menu.appendChild(b);
    });
    mapEl.appendChild(menu);
  }

  if (selectedIds.size >= 2) {
    const bar = document.createElement('div');
    bar.className = 'groupToolbar';
    const mk = (label, fn, danger) => {
      const b = document.createElement('button');
      b.textContent = label;
      if (danger) b.className = 'danger';
      b.addEventListener('click', (e) => { e.stopPropagation(); fn(); });
      return b;
    };
    bar.appendChild(mk('Copiar (' + selectedIds.size + ')', copySelection));

    bar.appendChild(mk('Cancelar', () => { clearSelection(); render(); }));
    mapEl.appendChild(bar);
  }
}

function fixturesInRect(x1, y1, x2, y2){
  const left = Math.min(x1,x2), right = Math.max(x1,x2);
  const top = Math.min(y1,y2), bottom = Math.max(y1,y2);
  return state.furniture.filter(f => {
    const fLeft = f.x, fRight = f.x + f.w, fTop = f.y, fBottom = f.y + f.h;
    return fLeft < right && fRight > left && fTop < bottom && fBottom > top;
  }).map(f => f.id);
}

mapEl.addEventListener('pointerdown', (e) => {
  if (e.target !== mapEl) return;
  if (e.button !== undefined && e.button !== 0) return;
  e.preventDefault();
  const rect = mapEl.getBoundingClientRect();
  const startX = (e.clientX - rect.left) / rect.width * 100;
  const startY = (e.clientY - rect.top) / rect.height * 100;
  let dragging = false;
  let boxEl = null;
  const ctrlHeld = e.ctrlKey || e.metaKey;
  const move = (ev) => {
    const curX = (ev.clientX - rect.left) / rect.width * 100;
    const curY = (ev.clientY - rect.top) / rect.height * 100;
    if (!dragging && (Math.abs(curX - startX) > 1 || Math.abs(curY - startY) > 1)) {
      dragging = true;
      boxEl = document.createElement('div');
      boxEl.className = 'selectionBox';
      mapEl.appendChild(boxEl);
    }
    if (dragging && boxEl) {
      const left = Math.min(startX, curX), top = Math.min(startY, curY);
      const w = Math.abs(curX - startX), h = Math.abs(curY - startY);
      boxEl.style.left = left + '%'; boxEl.style.top = top + '%';
      boxEl.style.width = w + '%'; boxEl.style.height = h + '%';
    }
  };
  const up = (ev) => {
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', up);
    if (dragging) {
      justFinishedRubberBand = true;
      const curX = (ev.clientX - rect.left) / rect.width * 100;
      const curY = (ev.clientY - rect.top) / rect.height * 100;
      const hitIds = fixturesInRect(startX, startY, curX, curY);
      if (ctrlHeld) { hitIds.forEach(id => selectedIds.add(id)); }
      else { selectedIds = new Set(hitIds); }
      quickMenuOpenFor = null;
      closeMapContextMenu();
      render();
    }
  };
  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', up);
});

mapEl.addEventListener('click', (e) => {
  if (justFinishedRubberBand) { justFinishedRubberBand = false; return; }

mapEl.addEventListener('dblclick', (e) => {

function enableDrag(handle, el, f){
  handle.addEventListener('pointerdown', (e) => {
    e.preventDefault(); e.stopPropagation();
    pushUndo();
    const rect = mapEl.getBoundingClientRect();
    const startX = e.clientX, startY = e.clientY;
    const groupIds = (selectedIds.size > 1 && selectedIds.has(f.id)) ? Array.from(selectedIds) : [f.id];
    const items = groupIds.map(id => {
      const gf = state.furniture.find(x => x.id === id);
      const gEl = mapEl.querySelector('[data-id="' + id + '"]');
      return (gf && gEl) ? { gf, gEl, origX: gf.x, origY: gf.y } : null;
    }).filter(Boolean);
    handle.setPointerCapture(e.pointerId);
    const move = (ev) => {
      const dxPct = (ev.clientX - startX) / rect.width * 100;
      const dyPct = (ev.clientY - startY) / rect.height * 100;
      items.forEach(({gf, gEl, origX, origY}) => {
        gf.x = snap(Math.max(0, Math.min(100 - gf.w, origX + dxPct)));
        gf.y = snap(Math.max(0, Math.min(100 - gf.h, origY + dyPct)));
        gEl.style.left = gf.x + '%';
        gEl.style.top = gf.y + '%';
      });
    };
    const up = () => {
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      persist();
    };
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);
  });
}

const EDGE_SIGN = { right:1, left:-1, bottom:1, top:-1 };
const EDGE_AXIS = { right:'w', left:'w', bottom:'h', top:'h' };
function axis0For(edge){ return EDGE_AXIS[edge]; }

// Drawers stay physically attached to the table and rotate with it (canonical edge, stored).
// These convert between that stored edge and whichever side it currently LOOKS like on screen,
// so the edit menu always shows/accepts the edge you actually see, not the pre-rotation one.
const EDGE_ANGLES = { right:0, bottom:90, left:180, top:270 };
const ANGLE_EDGES = { 0:'right', 90:'bottom', 180:'left', 270:'top' };
function visualEdgeFor(canonicalEdge, rot){
  let angle = ((EDGE_ANGLES[canonicalEdge] + (rot || 0)) % 360 + 360) % 360;
  angle = Math.round(angle / 90) * 90 % 360;
  return ANGLE_EDGES[angle];
}
function canonicalEdgeFor(visualEdge, rot){
  let angle = ((EDGE_ANGLES[visualEdge] - (rot || 0)) % 360 + 360) % 360;
  angle = Math.round(angle / 90) * 90 % 360;
  return ANGLE_EDGES[angle];
}
const RESIZE_CURSOR_BY_ANGLE = { 0:'ew-resize', 45:'nwse-resize', 90:'ns-resize', 135:'nesw-resize' };
function resizeCursorFor(edge, rot){
  let angle = ((EDGE_ANGLES[edge] + (rot || 0)) % 180 + 180) % 180;
  angle = Math.round(angle / 45) * 45 % 180;
  return RESIZE_CURSOR_BY_ANGLE[angle];
}

function enableResizeEdge(handle, el, f, edge){
  handle.addEventListener('pointerdown', (e) => {
    e.preventDefault(); e.stopPropagation();
    pushUndo();
    const rect = mapEl.getBoundingClientRect();
    const origW = f.w, origH = f.h;
    const cx = f.x + origW/2, cy = f.y + origH/2; // percent-of-own-axis center
    const { cos, sin } = trigFor(f.rot);
    const cosInv = cos, sinInv = -sin; // inverse rotation: cos(-θ)=cos(θ), sin(-θ)=-sin(θ)
    const MIN_SIZE = (f.type === 'hanger-t' && axis0For(edge) === 'w') ? GRID : GRID*3;
    const axis = EDGE_AXIS[edge], sign = EDGE_SIGN[edge];

    // Do all rotation math in real pixels (uniform scale), only converting
    // to/from each axis's own percent unit at the boundaries — percent-of-width
    // and percent-of-height are physically different sizes on a non-square map,
    // so mixing them directly into a rotation matrix distorts the shape.
    const anchorLocalPercent = axis === 'w' ? { x:-sign*origW/2, y:0 } : { x:0, y:-sign*origH/2 };
    const anchorLocalPx = { x: anchorLocalPercent.x/100*rect.width, y: anchorLocalPercent.y/100*rect.height };
    const cxPx = cx/100*rect.width, cyPx = cy/100*rect.height;
    const anchorWorldPx = {
      x: cxPx + (anchorLocalPx.x*cos - anchorLocalPx.y*sin),
      y: cyPx + (anchorLocalPx.x*sin + anchorLocalPx.y*cos)
    };

    handle.setPointerCapture(e.pointerId);
    let pendingEvent = null;
    let rafScheduled = false;

    function applyMove(ev){
      const mxPx = ev.clientX - rect.left;
      const myPx = ev.clientY - rect.top;
      const dxPx = mxPx - anchorWorldPx.x, dyPx = myPx - anchorWorldPx.y;
      const localXpx = dxPx*cosInv - dyPx*sinInv;
      const localYpx = dxPx*sinInv + dyPx*cosInv;
      const localXpercent = localXpx/rect.width*100;
      const localYpercent = localYpx/rect.height*100;

      let newW = origW, newH = origH;
      if (axis === 'w') {
        newW = snap(Math.max(MIN_SIZE, sign*localXpercent));
        if (f.type === 'hanger-round') newH = newW * MAP_ASPECT;
      } else {
        newH = snap(Math.max(MIN_SIZE, sign*localYpercent));
        if (f.type === 'hanger-round') newW = newH / MAP_ASPECT;
      }

      const halfOffsetLocalPercent = axis === 'w' ? { x:sign*newW/2, y:0 } : { x:0, y:sign*newH/2 };
      const halfOffsetLocalPx = { x: halfOffsetLocalPercent.x/100*rect.width, y: halfOffsetLocalPercent.y/100*rect.height };
      const newCenterPx = {
        x: anchorWorldPx.x + (halfOffsetLocalPx.x*cos - halfOffsetLocalPx.y*sin),
        y: anchorWorldPx.y + (halfOffsetLocalPx.x*sin + halfOffsetLocalPx.y*cos)
      };
      const newCenterPercent = { x: newCenterPx.x/rect.width*100, y: newCenterPx.y/rect.height*100 };

      f.w = newW; f.h = newH;
      f.x = snap(Math.max(0, newCenterPercent.x - newW/2));
      f.y = snap(Math.max(0, newCenterPercent.y - newH/2));
      el.style.width = f.w + '%';
      el.style.height = f.h + '%';
      el.style.left = f.x + '%';
      el.style.top = f.y + '%';
    }

    const move = (ev) => {
      pendingEvent = ev;
      if (!rafScheduled) {
        rafScheduled = true;
        requestAnimationFrame(() => {
          rafScheduled = false;
          if (pendingEvent) applyMove(pendingEvent);
        });
      }
    };
    const up = () => {
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      if (pendingEvent) applyMove(pendingEvent); // apply the final position even if a frame was skipped
      persist();
    };
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);
  });
}

async function duplicateSelection(){

function deleteSelection(){

async function pasteFixturesAt(x, y){
  if (!clipboardFixtures || !clipboardFixtures.length) return;
  if (hasCounterAmong(clipboardFixtures) && hasCounterAmong(state.furniture)) {
    await appAlert('Solo puede haber un Mostrador.');
    closeMapContextMenu(); render();
    return;
  }
  pushUndo();
  const minX = Math.min(...clipboardFixtures.map(f => f.x));
  const minY = Math.min(...clipboardFixtures.map(f => f.y));
  const maxX = Math.max(...clipboardFixtures.map(f => f.x + f.w));
  const maxY = Math.max(...clipboardFixtures.map(f => f.y + f.h));
  const groupW = maxX - minX, groupH = maxY - minY;
  const targetLeft = Math.max(0, Math.min(100 - groupW, x - groupW/2));
  const targetTop = Math.max(0, Math.min(100 - groupH, y - groupH/2));
  const newIds = [];
  clipboardFixtures.forEach(f => {
    const copy = reidFixture(f);
    copy.x = snap(targetLeft + (f.x - minX));
    copy.y = snap(targetTop + (f.y - minY));
    state.furniture.push(copy);
    newIds.push(copy.id);
  });
  persist();
  selectedIds = new Set(newIds);
  closeMapContextMenu();
  render();
}
function enableRotate(handle, el, f){
  handle.addEventListener('pointerdown', (e) => {
    e.preventDefault(); e.stopPropagation();
    pushUndo();
    const mapRect = mapEl.getBoundingClientRect();
    const centerX = mapRect.left + (f.x + f.w/2)/100*mapRect.width;
    const centerY = mapRect.top + (f.y + f.h/2)/100*mapRect.height;
    const halfW = (f.w/100)*mapRect.width/2;
    const halfH = (f.h/100)*mapRect.height/2;
    const baseAngle = Math.atan2(halfH, halfW) * 180/Math.PI;
    handle.setPointerCapture(e.pointerId);
    const move = (ev) => {
      const dx = ev.clientX - centerX, dy = ev.clientY - centerY;
      const angle = Math.atan2(dy, dx) * 180/Math.PI;
      let raw = ((angle - baseAngle) % 360 + 360) % 360;
      f.rot = Math.round(raw/45)*45 % 360;
      el.style.transform = `rotate(${f.rot}deg)`;
    };
    const up = () => {
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      persist(); render();
    };
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);
  });
}

// --- VIEW: contents of one drawer / hanger ---
function productLabel(p){ return typeof p === 'string' ? p : p.name; }
function productImage(p){
  if (!p || typeof p !== 'object' || !p.image) return null;
  if (/\.(mp4|webm|mov|gif)(\?|$)/i.test(p.image)) return null;
  return p.image;
}
function productPrice(p){ return (p && typeof p === 'object' && p.price) ? p.price : ''; }
function formatPriceEuro(price){ return price ? String(price).replace('.', ',') : ''; }
function productDisplayHtml(p){
  const price = productPrice(p);
  return productLabel(p) + (price ? ' — <b style="color:#2563eb;">' + formatPriceEuro(price) + ' €</b>' : '');
}
function isDrawerTypeFixture(f){ return f && (f.type === 'table' || f.type === 'counter'); }
function parseProductName(rawName){
  const name = typeof rawName === 'string' ? rawName : '';
  const skuMatch = name.match(/([A-Za-z0-9]{3,}-\d{1,6})/);
  const sku = skuMatch ? skuMatch[1] : '';
  let title = sku ? name.replace(sku, '') : name;
  title = title.replace(/\(\s*\)/g, '').replace(/[–—-]\s*$/, '').replace(/^\s*[–—-]/, '');
  title = cleanKoroshiTitle(title.replace(/\s{2,}/g, ' ').trim());
  return { sku, title };
}
function formatProductName(sku, title){
  return sku ? sku + ' — ' + title : title;
}
function extractProductKey(p){
  const parsed = parseProductName(productLabel(p));
  return (parsed.sku || parsed.title).toLowerCase();
}

function findProductLocations(key){
  const matches = [];
  for (const f of state.furniture){
    for (const d of f.drawers){
      for (const p of d.products){
        if (extractProductKey(p) === key) matches.push({ furnitureId: f.id, drawerId: d.id, isDrawerType: isDrawerTypeFixture(f) });
      }
    }
  }
  return matches;
}

function openViewSheet(furnitureId, drawerId){
  const f = state.furniture.find(x => x.id === furnitureId);
  const d = f.drawers.find(x => x.id === drawerId);
  const sortedProducts = d.products
    .map((p, originalIdx) => ({ p, originalIdx, parsed: parseProductName(productLabel(p)) }))
    .sort((a, b) => (a.parsed.sku || a.parsed.title).toLowerCase().localeCompare((b.parsed.sku || b.parsed.title).toLowerCase(), 'es'));
  let items = sortedProducts.map(({ p, originalIdx, parsed }) => {
    const price = productPrice(p);
    return `
    <div class="rowItem">
      ${productImage(p) ? `<img class="prodThumb lightboxable" src="${productImage(p)}">` : ''}
      <span style="flex:1;">
        <b>${parsed.sku || ''}</b>${parsed.sku && price ? ' — ' : ''}${price ? '<b style="color:#2563eb;">' + formatPriceEuro(price) + ' €</b>' : ''}<br>
        ${parsed.title}
      </span>
      <button class="del" data-idx="${originalIdx}">Quitar</button>
    </div>`;
  }).join('') || '<div class="small">Vacío.</div>';
  openSheet(`
    <div class="sheetHeader"><h2>${f.name} — ${d.name}</h2><button class="btn-ghost" onclick="closeSheet()">Cerrar</button></div>
    <div id="productList">${items}</div>
    <div class="searchWrap">
      <input type="text" id="productSearchInput" placeholder="Buscar en Koroshi... (ej: 2622JA)" autocomplete="off">
      <div id="searchResults" class="searchResults"></div>
      <div id="searchStatus" class="small"></div>
    </div>
  `);
  sheet.querySelectorAll('[data-idx]').forEach(b => {
    b.addEventListener('click', () => {
      pushUndo();
      d.products.splice(Number(b.dataset.idx), 1);
      persist();
      openViewSheet(furnitureId, drawerId);
    });
  });

  const searchInput = document.getElementById('productSearchInput');
  setTimeout(() => searchInput.focus(), 100);
  const resultsEl = document.getElementById('searchResults');
  const statusEl = document.getElementById('searchStatus');
  let debounceTimer = null;

  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim();
    resultsEl.innerHTML = '';
    if (debounceTimer) clearTimeout(debounceTimer);
    if (q.length < 2) { statusEl.textContent = ''; return; }
    statusEl.textContent = 'Buscando...';
    debounceTimer = setTimeout(async () => {
      try {
        const products = await searchKoroshi(q);
        statusEl.textContent = products.length ? '' : 'Sin resultados.';
        const targetIsDrawerType = isDrawerTypeFixture(f);
                function addDrawerVariant(p, v){
          pushUndo();
          const cleanTitle = cleanKoroshiTitle(p.title);
          const sku = v.sku ? trimSkuZeros(v.sku) : '';
          d.products.push({ name: formatProductName(sku, cleanTitle), image: v.image || p.image || '', url: p.url ? ('https://koroshishop.com' + p.url) : '', price: p.price || '' });
          persist();
          openViewSheet(furnitureId, drawerId);
        }
        function renderProductList(){
          resultsEl.innerHTML = products.map((p,i) => {
            const cleanTitle = cleanKoroshiTitle(p.title);
            const priceHtml = p.price ? ' — <b style="color:#2563eb;">' + formatPriceEuro(p.price) + ' €</b>' : '';
            const colorCount = (p.variants && p.variants.length) ? p.variants.length : 1;
            const colorNote = colorCount > 1 ? ' <span class="small">(' + colorCount + ' colores)</span>' : '';
            return `
            <div class="searchResultItem" data-prod-i="${i}">
              <img src="${p.image || ''}" onerror="this.style.visibility='hidden'">
              <span>${cleanTitle}${priceHtml}${colorNote}</span>
            </div>`;
          }).join('');
          resultsEl.querySelectorAll('[data-prod-i]').forEach(el => {
            el.addEventListener('click', () => {
              const p = products[Number(el.dataset.prodI)];
              const variants = (p.variants && p.variants.length) ? p.variants : [{ sku:'', color:'', image:'' }];
              if (variants.length <= 1) { addDrawerVariant(p, variants[0]); return; }
              renderColorPicker(p);
            });
          });
        }

        function renderColorPicker(p){
          const variants = (p.variants && p.variants.length) ? p.variants : [{ sku:'', color:'', image:'' }];
          const cleanTitle = cleanKoroshiTitle(p.title);
          const rowsHtml = variants.map((v,i) => {
            const sku = v.sku ? trimSkuZeros(v.sku) : '';
            const key = (sku || p.title).trim().toLowerCase();
            const matches = findProductLocations(key);
            const sameDrawerMatch = matches.find(m => m.drawerId === drawerId);
            let dupNote = '', disabled = false;
            if (sameDrawerMatch) { disabled = true; dupNote = 'Ya está en este cajón'; }
            else if (targetIsDrawerType && matches.some(m => m.isDrawerType)) { disabled = true; dupNote = 'Ya está en otro cajón'; }
            const colorLabel = v.color || 'Único';
            return `
            <div class="searchResultItem${disabled ? ' disabled' : ''}" data-color-i="${i}" ${disabled ? 'data-disabled="1"' : ''}>
              <img src="${v.image || p.image || ''}" onerror="this.style.visibility='hidden'">
              <span>${sku ? '<span style="color:#6b7280;font-size:11px;">' + sku + ' — </span>' : ''}${colorLabel}${dupNote ? '<span class="dupNote">' + dupNote + '</span>' : ''}</span>
            </div>`;
          }).join('');
          resultsEl.innerHTML = `
            <div class="rowItem" style="cursor:pointer;" id="backToProductsBtn"><span>← ${cleanTitle} — elige color</span></div>
            ${rowsHtml}
          `;
          document.getElementById('backToProductsBtn').addEventListener('click', renderProductList);
          resultsEl.querySelectorAll('[data-color-i]:not([data-disabled])').forEach(el => {
            el.addEventListener('click', () => {
              addDrawerVariant(p, variants[Number(el.dataset.colorI)]);
            });
          });
        }

        renderProductList();
      } catch (err) {
        if (err.name === 'AbortError') return; // a newer keystroke superseded this search — not a real error

async function updateAllSkus(){
  const targets = [];
  state.furniture.forEach(f => f.drawers.forEach(d => d.products.forEach((p, i) => {
    const parsed = parseProductName(productLabel(p));
    if (!parsed.sku) targets.push({ f, d, p, i, title: parsed.title });
  })));
  if (!targets.length) { await appAlert('Todos los artículos ya tienen SKU.'); return; }
  if (!(await appConfirm('Se buscarán ' + targets.length + ' artículo(s) en Koroshi para completar su SKU. ¿Continuar?', 'Continuar'))) return;
  pushUndo();
  let updated = 0, failed = 0;
  for (const t of targets) {
    try {
      const results = await searchKoroshi(t.title);
      const match = results.find(r => cleanKoroshiTitle(r.title).toLowerCase() === t.title.toLowerCase()) || results[0];
      const sku = (match && match.variants && match.variants[0] && match.variants[0].sku) ? trimSkuZeros(match.variants[0].sku) : '';
      if (match && sku) {
        const newName = formatProductName(sku, cleanKoroshiTitle(match.title));
        if (typeof t.p === 'string') {
          t.d.products[t.i] = { name: newName, image: match.image || '', url: match.url ? ('https://koroshishop.com' + match.url) : '', price: match.price || '' };
        } else {
          t.p.name = newName;
          if (match.image) t.p.image = match.image; // always refresh — old stored images may be a poor video-derived frame
          if (!t.p.price && match.price) t.p.price = match.price;
        }
        updated++;
      } else {
        failed++;
      }
    } catch (err) {
      failed++;
    }
  }
  persist();
  await appAlert('Actualizado: ' + updated + '. Sin coincidencia: ' + failed + '.');
  renderAllItemsList();
}

async function cleanAllLegacyTitles(){

async function updateAllPrices(){
  const targets = [];
  state.furniture.forEach(f => f.drawers.forEach(d => d.products.forEach((p, i) => {
    const parsed = parseProductName(productLabel(p));
    if (parsed.sku && !productPrice(p)) targets.push({ f, d, p, i, sku: parsed.sku, title: parsed.title });
  })));
  if (!targets.length) { await appAlert('Todos los artículos con SKU ya tienen precio.'); return; }
  if (!(await appConfirm('Se buscarán ' + targets.length + ' artículo(s) en Koroshi para completar su precio. ¿Continuar?', 'Continuar'))) return;
  pushUndo();
  let updated = 0, failed = 0;
  for (const t of targets) {
    try {
      // Search the base code (SKU minus its trailing color-number segment) — Koroshi's
      // search matches this far more reliably than the full "BASE-NUMBER" string, and
      // returns the whole colorway family so we can pick the exact SKU match from it.
      const baseParts = t.sku.split('-');
      const searchTerm = baseParts.length > 1 ? baseParts.slice(0, -1).join('-') : t.sku;
      const results = await searchKoroshi(searchTerm);
      const match = results.find(r => {
        const rsku = (r.variants && r.variants[0] && r.variants[0].sku) ? trimSkuZeros(r.variants[0].sku) : '';
        return rsku === t.sku;
      }) || results.find(r => {
        const rsku = (r.variants && r.variants[0] && r.variants[0].sku) ? trimSkuZeros(r.variants[0].sku) : '';
        return rsku.startsWith(searchTerm);
      }) || results[0];
      if (match && match.price) {
        if (typeof t.p === 'string') {
          t.d.products[t.i] = { name: productLabel(t.p), price: match.price, image: match.image || '' };
        } else {
          t.p.price = match.price;
          if (match.image) t.p.image = match.image; // always refresh — old stored images may be a poor video-derived frame
        }
        updated++;
      } else {
        failed++;
      }
    } catch (err) {
      failed++;
    }
  }
  persist();
  await appAlert('Actualizado: ' + updated + '. Sin coincidencia: ' + failed + '.');
  renderAllItemsList();
}

async function autoRefreshPricesAndImages(code){
  // Runs quietly after login/store-switch — no prompts. Images update silently
  // (never a "real" change worth interrupting for). Price CHANGES (old price
  // exists and differs from new) are queued for review instead of applied —
  // only a brand-new missing price gets filled in directly.
  const targets = [];
  state.furniture.forEach(f => f.drawers.forEach(d => d.products.forEach((p, i) => {
    const parsed = parseProductName(productLabel(p));
    if (parsed.sku) targets.push({ f, d, p, i, sku: parsed.sku, title: parsed.title });
  })));
  if (!targets.length) return;

  let imagesChanged = false;
  const pending = getPendingChanges(code);
  const nowIso = new Date().toISOString();

  for (const t of targets) {
    try {
      const baseParts = t.sku.split('-');
      const searchTerm = baseParts.length > 1 ? baseParts.slice(0, -1).join('-') : t.sku;
      const results = await searchKoroshi(searchTerm);
      const match = results.find(r => {
        const rsku = (r.variants && r.variants[0] && r.variants[0].sku) ? trimSkuZeros(r.variants[0].sku) : '';
        return rsku === t.sku;
      });
      if (!match) continue;

      const currentPrice = productPrice(t.p);

      if (match.price && currentPrice && match.price !== currentPrice) {
        const already = pending.find(pc => pc.sku === t.sku && pc.furnitureId === t.f.id && pc.drawerId === t.d.id);
        if (already) {
          already.newPrice = match.price; // price moved again before being reviewed
        } else {
          pending.push({ sku: t.sku, title: t.title, furnitureId: t.f.id, drawerId: t.d.id, oldPrice: currentPrice, newPrice: match.price, detectedAt: nowIso });
        }
      } else if (match.price && !currentPrice) {
        // no price on file yet — fill it in directly, this isn't a "change" to review
        if (typeof t.p === 'string') { t.d.products[t.i] = { name: productLabel(t.p), price: match.price }; }
        else { t.p.price = match.price; }
        imagesChanged = true; // reuse the same persist/render flag
      }

      if (match.image) {
        if (typeof t.p === 'string') {
          if (!productImage(t.d.products[t.i])) { t.d.products[t.i].image = match.image; imagesChanged = true; }
        } else if (match.image !== t.p.image) {
          t.p.image = match.image;
          imagesChanged = true;
        }
      }
    } catch (err) {
      // network hiccup on this one item — skip it, move on
    }
  }

  setPendingChanges(code, pending);

  if (code === currentStore) {
    if (imagesChanged) { persist(); render(); }
    updatePriceAlertButton();
  }
}

// --- Pending price-change review queue (per store, local only — not synced to cloud) ---
const PENDING_PRICE_PREFIX = 'storeMapPendingPrices_v1_';
function getPendingChanges(code){
  try { return JSON.parse(localStorage.getItem(PENDING_PRICE_PREFIX + code) || '[]'); }
  catch (e) { return []; }
}
function setPendingChanges(code, arr){
  localStorage.setItem(PENDING_PRICE_PREFIX + code, JSON.stringify(arr));
}
function updatePriceAlertButton(){
  const pending = getPendingChanges(currentStore);
  if (pending.length) {
    priceAlertBtn.style.display = 'flex';
    priceAlertBtn.textContent = '⚠️ ¡Cambios de precio! (' + pending.length + ')';
  } else {
    priceAlertBtn.style.display = 'none';
  }
}
function formatChangeDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('es-ES', { day:'2-digit', month:'2-digit', year:'numeric' }) +
    ' ' + d.toLocaleTimeString('es-ES', { hour:'2-digit', minute:'2-digit' });
}
function findProductBySku(furnitureId, drawerId, sku){
  const f = state.furniture.find(x => x.id === furnitureId);
  if (!f) return null;
  const d = f.drawers.find(x => x.id === drawerId);
  if (!d) return null;
  const idx = d.products.findIndex(p => parseProductName(productLabel(p)).sku === sku);
  if (idx === -1) return null;
  return { d, idx, p: d.products[idx] };
}
function removePendingChange(record){
  const pending = getPendingChanges(currentStore).filter(pc =>
    !(pc.sku === record.sku && pc.furnitureId === record.furnitureId && pc.drawerId === record.drawerId)
  );
  setPendingChanges(currentStore, pending);
}
function acceptPriceChange(record){
  const found = findProductBySku(record.furnitureId, record.drawerId, record.sku);
  if (found) {
    if (typeof found.p === 'string') {
      found.d.products[found.idx] = { name: found.p, price: record.newPrice };
    } else {
      found.p.price = record.newPrice;
    }
    persist();
  }
  removePendingChange(record);
  updatePriceAlertButton();
}
function discardPriceChange(record){
  removePendingChange(record);
  updatePriceAlertButton();
}
async function acceptAllPriceChanges(){
  const pending = getPendingChanges(currentStore);
  pending.forEach(record => {
    const found = findProductBySku(record.furnitureId, record.drawerId, record.sku);
    if (found) {
      if (typeof found.p === 'string') {
        found.d.products[found.idx] = { name: found.p, price: record.newPrice };
      } else {
        found.p.price = record.newPrice;
      }
    }
  });
  persist();
  setPendingChanges(currentStore, []);
  updatePriceAlertButton();
  render();
}
async function discardAllPriceChanges(){
  setPendingChanges(currentStore, []);
  updatePriceAlertButton();
}

function renderPriceChangesPanel(){
  const pending = getPendingChanges(currentStore);
  const rows = pending.map((record, i) => {
    const found = findProductBySku(record.furnitureId, record.drawerId, record.sku);
    const img = found ? productImage(found.p) : null;
    return `
    <div class="rowItem">
      ${img ? `<img class="prodThumb lightboxable" src="${img}">` : ''}
      <span style="flex:1;">
        <b>${record.sku}</b><br>
        ${record.title}<br>
        <span class="priceOld">${formatPriceEuro(record.oldPrice)} €</span> → <span class="priceNew">${formatPriceEuro(record.newPrice)} €</span>
        <span class="priceChangeDate">Detectado: ${formatChangeDate(record.detectedAt)}</span>
      </span>
      <div class="priceChangeActions">
        <button class="btn-primary" data-accept-i="${i}">Aceptar</button>
        <button class="btn-ghost" data-discard-i="${i}">Descartar</button>
      </div>
    </div>`;
  }).join('') || '<div class="small">No hay cambios de precio pendientes.</div>';

  openSheet(`
    <div class="sheetHeader"><h2>Cambios de precio (${pending.length})</h2><button class="btn-ghost" onclick="closeSheet()">Cerrar</button></div>
    <p class="small">Algunos productos han cambiado de precio en Koroshi desde tu última visita. Revisa cada uno y decide si aplicar el nuevo precio.</p>
    ${pending.length ? `
    <div class="addRow" style="margin-top:10px;">
      <button class="btn-primary" id="acceptAllPricesBtn" style="flex:1;">Aceptar todos</button>
      <button class="btn-ghost" id="discardAllPricesBtn" style="flex:1;">Descartar todos</button>
    </div>` : ''}
    <div style="margin-top:12px;">${rows}</div>
  `);

  sheet.querySelectorAll('[data-accept-i]').forEach(btn => {
    btn.addEventListener('click', () => {
      const record = pending[Number(btn.dataset.acceptI)];
      acceptPriceChange(record);
      render();
      renderPriceChangesPanel();
    });
  });
  sheet.querySelectorAll('[data-discard-i]').forEach(btn => {
    btn.addEventListener('click', () => {
      const record = pending[Number(btn.dataset.discardI)];
      discardPriceChange(record);
      renderPriceChangesPanel();
    });
  });
  const acceptAllBtn = document.getElementById('acceptAllPricesBtn');
  if (acceptAllBtn) acceptAllBtn.addEventListener('click', async () => { await acceptAllPriceChanges(); renderPriceChangesPanel(); });
  const discardAllBtn = document.getElementById('discardAllPricesBtn');
  if (discardAllBtn) discardAllBtn.addEventListener('click', async () => { await discardAllPriceChanges(); renderPriceChangesPanel(); });
}

const priceAlertBtn = document.getElementById('priceAlertBtn');
priceAlertBtn.addEventListener('click', renderPriceChangesPanel);

function updateMapHeight(){
  const viewport = document.getElementById('mapViewport');
  const wrapWidth = viewport.clientWidth;
  if (!wrapWidth) return;
  const FIXED_GRID_SQUARES_TALL = 22; // hard-coded crop height, in grid squares (GRID = 2% each)
  const paddedPercent = FIXED_GRID_SQUARES_TALL * GRID;
  const fullHeightPx = wrapWidth / MAP_ASPECT; // matches #map's own real aspect-ratio — keeps coordinate math correct
  viewport.style.height = (fullHeightPx * (paddedPercent / 100)) + 'px';
}

const listAllBtn = document.getElementById('listAllBtn');
listAllBtn.addEventListener('click', renderAllItemsList);

window.addEventListener('resize', updateMapHeight);
new ResizeObserver(updateMapHeight).observe(document.getElementById('mapViewport'));

</script>
